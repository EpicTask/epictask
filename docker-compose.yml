version: '3.8'

services:
  mono_service:
    build: 
      context: ../mono_service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CORS_ORIGINS=http://localhost:3000,http://localhost:19006
      - CREDENTIALS_PATH=/app/src/config/service_accounts/service_account.json
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./templates:/app/templates
      - ./src/config/service_accounts:/app/src/config/service_accounts

  xrpl_management:
    build:
      context: ../xrpl_management
      dockerfile: Dockerfile
    ports:
      - "8084:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - ../xrpl_management/.env
    restart: unless-stopped
