[package]
name = "lesson-recommender"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.4"
actix-rt = "2.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Environment variables
dotenv = "0.15"

# Logging
env_logger = "0.11"
log = "0.4"

# HTTP client (for Firestore if needed)
reqwest = { version = "0.11", features = ["json"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
actix-web-test = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
